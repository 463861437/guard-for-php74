name: Native AL2 build environment regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/build_env_backend.py'
      - 'src/build_environment.py'
      - 'src/rpm_backend.py'
      - 'src/backport_builder.py'
      - 'src/deb_builder.py'
      - 'src/common.py'
      - 'assemble.py'
      - 'tools/build_env_native_smoke.py'
      - 'tools/php_ini_isolation_smoke.py'
      - '.github/workflows/build-env.yml'
  pull_request:
    paths:
      - 'src/build_env_backend.py'
      - 'src/build_environment.py'
      - 'src/rpm_backend.py'
      - 'src/backport_builder.py'
      - 'src/deb_builder.py'
      - 'src/common.py'
      - 'assemble.py'
      - 'tools/build_env_native_smoke.py'
      - 'tools/php_ini_isolation_smoke.py'
      - '.github/workflows/build-env.yml'
permissions:
  contents: read
jobs:
  installed-httpd:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Assemble production payload
        run: python3 assemble.py
      - name: Plan full SRPM dependencies and install matching httpd-devel in disposable AL2
        run: |
          docker run --rm --interactive --pull always --platform linux/amd64 \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --env PHP_GUARD_DISPOSABLE_BUILD_ENV_CI=1 \
            amazonlinux:2 /bin/bash -s <<'CONTAINER'
          set -euo pipefail
          yum -y install amazon-linux-extras curl
          amazon-linux-extras enable php7.4
          # The old runtime reproduces the reported dependency conflict. All
          # packages come from native signed official repositories; no nogpgcheck.
          # Pin its old module too: the latest mod_http2 requires latest httpd
          # and would otherwise cause YUM to silently replace this fixture.
          yum -y install httpd-2.4.62-1.amzn2.0.2 \
            httpd-tools-2.4.62-1.amzn2.0.2 httpd-filesystem-2.4.62-1.amzn2.0.2 \
            mod_http2-1.15.19-1.amzn2.0.2
          cd /workspace
          /usr/bin/python2.7 -E -s tools/build_env_native_smoke.py
          # Run the unchanged PHP 7.4 SPL PHPT using the upstream make-test
          # recipe. Synthetic INIs stay in a private temporary fixture.
          yum -y install python3 php-cli make
          source_dir=/tmp/phpguard-ini-source
          # The three fixture files are byte-identical to the pinned BaoTa
          # archive; run-tests.php differs only in expanded $Id version text.
          for source_file in run-tests.php build/Makefile.global build/shtool tests/run-test/bug75042-2.phpt; do
            case "$source_file" in
              run-tests.php) source_sha=f7b472dd7b8ae90689a0f22f2af8f4abee4e44276ad3ddff2a51044d08d23e93 ;;
              build/Makefile.global) source_sha=20302a4a36f8cae5816473b403a1008e88cd2df29609f7b92768ab8e716fffbe ;;
              build/shtool) source_sha=875c6f071a3b7caa83d551809194bd82a0e6ad048a4bb89078928f9183d2b98c ;;
              tests/run-test/bug75042-2.phpt) source_sha=443616fbb623e1939b0584a177eef23c04ea89823e803b33c1cf7ccd570ba6d8 ;;
            esac
            mkdir -p "$source_dir/$(dirname "$source_file")"
            curl -fsSL --proto '=https' --proto-redir '=https' --connect-timeout 20 \
              --max-time 60 --retry 1 \
              "https://raw.githubusercontent.com/php/php-src/php-7.4.33/$source_file" \
              -o "$source_dir/$source_file"
            printf '%s  %s\n' "$source_sha" "$source_dir/$source_file" | sha256sum -c -
          done
          chmod 755 "$source_dir/build/shtool"
          /usr/bin/python3 tools/php_ini_isolation_smoke.py \
            --php /usr/bin/php --source "$source_dir"
          CONTAINER
      - name: Evidence scope
        if: always()
        run: |
          {
            echo '### Evidence scope'
            echo 'Disposable official Amazon Linux 2 x86_64 container; native Python 2.7/YUM/RPM.'
            echo 'Verifies the fixed PHP SRPM SHA256 and AWS signature, plans its real build requirements, refuses a no-match httpd-devel requirement before install, then installs matching httpd-devel dependencies through the production signature and transaction checks.'
            echo 'Asserts the installed httpd, httpd-tools, httpd-filesystem and mod_http2 stay at their fixture versions, and both previews and the blocked request leave the RPM database unchanged.'
            echo 'Also reproduces default/scanned PHP INI pollution with real PHP 7.4 and the unchanged upstream SPL PHPT, then verifies production RPM and DEB child environments pass it while explicit -c/-d settings remain effective.'
            echo 'Does not build or install patched PHP, operate production services, or validate business behavior.'
          } >> "$GITHUB_STEP_SUMMARY"
