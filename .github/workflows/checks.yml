name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and failure-path tests (no package installation)
        run: python -m unittest discover -s tests -q
      - name: Generated payload, syntax, and checksums
        run: |
          python assemble.py
          git diff --exit-code -- php_guard.py php-cve-guard.sh php74-patch.sh
          for script in php-cve-guard.sh php74-patch.sh run-fleet.sh; do bash -n "$script"; done
          python tools/verify_manifest.py
